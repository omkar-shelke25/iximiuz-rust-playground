markdown: |-
    A disposable Rust development environment. Stable, beta, and nightly toolchains, cargo-watch, rustfmt, clippy, rust-analyzer, codelldb, and the musl cross-compilation target are all pre-installed. Full IDE support via VS Code with a native debugger. Runs on 4 vCPU / 10 GiB RAM / 100 GiB disk.

    Nothing is persisted once the playground stops.

    ## What's included

    - `rustc` / `cargo` (stable, beta, nightly)
    - `rustfmt` code formatter (all three toolchains)
    - `clippy` linter (all three toolchains)
    - `rust-src` so rust-analyzer can resolve the standard library
    - `cargo-watch` to recompile on file change
    - `rust-analyzer` for IDE intelligence in VS Code
    - `codelldb` native debugger in VS Code
    - `x86_64-unknown-linux-musl` target for static binaries
    - A C toolchain, `pkg-config`, and `libssl-dev` for the common `-sys` crates

    ## Key commands

    ### New project
    ```bash
    cargo new hello && cd hello
    cargo run
    ```

    ### Build
    ```bash
    cargo check                 # type check, no linking, fastest
    cargo build                 # debug build
    cargo build --release       # optimized build

    # Static binary, runs anywhere, no libc needed
    cargo build --release --target x86_64-unknown-linux-musl
    ```

    ### Test
    ```bash
    cargo test                  # run all tests
    cargo test test_name        # run one test
    cargo test -- --nocapture   # show println! output
    ```

    ### Format and lint
    ```bash
    cargo fmt                   # format all files
    cargo fmt -- --check        # check without modifying
    cargo clippy                # lint with suggestions
    cargo clippy -- -D warnings # treat warnings as errors
    ```

    ### Dependencies
    ```bash
    cargo add serde --features derive
    cargo update                # update the lockfile
    cargo tree                  # show the dependency graph
    cargo doc --open            # build and read your crate docs
    ```

    ### Watch mode
    ```bash
    cargo watch -x run          # rerun on save
    cargo watch -x test         # retest on save
    cargo watch -x "run -- --flag"
    ```

    ### Switch toolchain
    ```bash
    cargo +nightly run          # run with nightly
    cargo +beta build           # build with beta
    rustup show                 # what is installed and active
    rustup toolchain list       # all toolchains
    rustup update               # pull the latest of each
    ```

    ### Understand an error
    ```bash
    rustc --explain E0382       # full write-up for any error code
    ```

    ## Where things live

    The toolchain is installed system wide, so `root` and `laborant` share it.

    | Path | Contents |
    |---|---|
    | `/usr/local/rustup` | Toolchains and components |
    | `/usr/local/cargo` | Cargo binaries and the crates.io cache |

    Both are writable by any user, so `cargo install` and `cargo add` work without `sudo`.
playground:
    networks:
        - name: local
          subnet: 172.16.0.0/24
    machines:
        - name: rust-01
          users:
            - name: root
            - name: laborant
              default: true
          drives:
            - source: oci://ghcr.io/omkar-shelke25/rust-playground:sha-3a68c69
              mount: /
              size: 100GiB
          network:
            interfaces:
                - network: local
          resources:
            cpuCount: 4
            ramSize: 10GiB
    tabs:
        - id: ide-rust-01
          kind: ide
          name: IDE
          machine: rust-01
        - id: terminal-rust-01
          kind: terminal
          name: Term
          machine: rust-01
        - id: rust-docs
          kind: web-page
          name: doc.rust
          machine: rust-01
          url: https://doc.rust-lang.org/book/
    initTasks:
        verify_toolchain:
            name: verify_toolchain
            machine: rust-01
            init: true
            user: laborant
            timeout_seconds: 60
            run: rustc --version && cargo --version && cargo clippy --version
    accessControl:
        canList:
            - anyone
        canRead:
            - anyone
        canStart:
            - anyone
