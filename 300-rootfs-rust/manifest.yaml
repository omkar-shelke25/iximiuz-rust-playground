kind: playground
name: rust-playground-303b96c8
base: flexbox
title: Rust Programming
description: A disposable Rust development environment with stable, beta, and nightly toolchains, bacon, cargo-nextest, rustfmt, clippy, rust-analyzer, and the musl target pre-installed.
