name: Docker Build & Push

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "300-rootfs-rust/Dockerfile"
      - ".github/workflows/docker-publish.yml"
      # - "300-rootfs-rust/welcome"
  pull_request:
    branches: [main]
    paths:
      - "300-rootfs-rust/Dockerfile"
      - ".github/workflows/docker-publish.yml"
      # - "300-rootfs-rust/welcome"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rust-playground
  CONTEXT: ./300-rootfs-rust

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build-push.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free up runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Normalize image name
        id: image
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Rust playground rootfs
            org.opencontainers.image.description=iximiuz Labs rootfs with Rust stable, beta and nightly, cargo-watch, rustfmt, clippy and the musl target

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.CONTEXT }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Image pushed"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| digest | \`${{ steps.build-push.outputs.digest }}\` |"
            echo
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Drive source for a playground manifest:"
            echo '```'
            echo "oci://${{ env.REGISTRY }}/${{ steps.image.outputs.name }}@${{ steps.build-push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
